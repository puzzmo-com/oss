# Builds the puzzmo-codegen Rust binary for every supported platform and publishes one npm
# package per platform, as @puzzmo/codegen-<platform>.
#
# The crate is NOT authored here. It lives in the private puzzmo-com/app monorepo at
# crates/puzzmo-codegen and is mirrored into this repo by that repo's OSS-Sync.yml, along
# with packages/codegen (which carries the publish script below). Edit it there, not here.
#
# Publishing happens from this repo rather than the monorepo because this one is public:
# npm trusted publishing (OIDC) and provenance both need that, and no npm token is involved.
#
# A copy of this file is kept beside the crate in the monorepo for discoverability. The sync
# deliberately does not write to .github/, so if you change this, change it in both places.
name: Publish codegen binaries to npm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/puzzmo-codegen/**"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            linker: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            exe: .exe
    steps:
      - uses: actions/checkout@v5

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --manifest-path crates/Cargo.toml --target ${{ matrix.target }}

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: crates/target/${{ matrix.target }}/release/puzzmo-codegen${{ matrix.exe }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download every platform binary
        uses: actions/download-artifact@v4
        with:
          path: binaries

      # Picks one version for all five packages and publishes them together. A partial
      # build fails the script rather than leaving the packages on different versions.
      - name: Publish one package per platform
        run: node packages/codegen/scripts/publishPlatformPackages.mjs
