[package]
name = "puzzmo-codegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "puzzmo-codegen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
